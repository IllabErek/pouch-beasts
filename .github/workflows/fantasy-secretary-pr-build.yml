name: Fantasy Secretary PR Build

on:
  pull_request:
    branches: [ fantasy-secretary-apk-runner ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy-secretary-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-secretary-apk
          path: fantasy-secretary-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
